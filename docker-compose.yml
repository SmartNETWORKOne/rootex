services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rootex
      POSTGRES_PASSWORD: rootex
      POSTGRES_DB: rootex
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  discovery:
    build: .
    command: python3 -m core.discovery
    restart: always
    environment:
      DATABASE_URL: postgresql://rootex:rootex@db:5432/rootex
    depends_on:
      - db

  validator:
    build: .
    command: python3 -m core.validator
    restart: always
    environment:
      DATABASE_URL: postgresql://rootex:rootex@db:5432/rootex
    depends_on:
      - db

  indexer:
    build: .
    command: python3 -m core.indexer
    restart: always
    environment:
      DATABASE_URL: postgresql://rootex:rootex@db:5432/rootex
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    depends_on:
      - db
      - qdrant
